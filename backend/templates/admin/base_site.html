{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | Genzicon Admin{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}" style="display: inline-flex; align-items: center; gap: 8px; font-weight: bold; color: #ffffff; text-decoration: none; font-size: 15px;">
    <span style="background: #00743a; color: #ffffff; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; border-radius: 2px;">G</span>
    <span>Genzicon Foundation Nepal • CMS Admin</span>
  </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* --------------------------------------------------------------------------
     Clean, Non-Overlapping Sidebar & Sticky Visible Save Button Bar Layout
     -------------------------------------------------------------------------- */
  
  /* Container & Main flex layout */
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #f8fafc;
  }

  #container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  #header {
    background: #003c90 !important;
    color: #ffffff !important;
    padding: 10px 24px !important;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  }

  #header a:link, #header a:visited {
    color: #ffffff !important;
  }

  /* Main wrapper containing Sidebar + Content */
  #main {
    display: flex !important;
    flex-direction: row !important;
    flex: 1 !important;
    min-width: 0 !important;
    position: relative !important;
    background: #ffffff;
  }

  /* Unscrollable / Fixed Left Navigation Sidebar */
  #nav-sidebar {
    position: sticky !important;
    top: 52px !important;
    height: calc(100vh - 52px) !important;
    max-height: calc(100vh - 52px) !important;
    width: 270px !important;
    min-width: 270px !important;
    max-width: 270px !important;
    flex-shrink: 0 !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    background: #f8fafc !important;
    border-right: 1px solid #d8e3fb !important;
    box-sizing: border-box !important;
    z-index: 30 !important;
    padding-bottom: 40px !important;
  }

  /* Content area: Takes remaining width and NEVER gets covered by sidebar */
  #content {
    flex: 1 1 auto !important;
    min-width: 0 !important;
    width: calc(100% - 270px) !important;
    padding: 24px 36px 120px 36px !important;
    box-sizing: border-box !important;
    overflow-x: auto !important;
    background: #ffffff !important;
    position: relative !important;
    z-index: 40 !important;
    pointer-events: auto !important;
  }

  #content-main {
    max-width: 100% !important;
    padding-bottom: 80px !important;
    position: relative !important;
    z-index: 40 !important;
    pointer-events: auto !important;
  }

  /* Responsive adjustment when sidebar is collapsed or on smaller viewports */
  @media (max-width: 900px) {
    #main {
      flex-direction: column !important;
    }
    #nav-sidebar {
      position: relative !important;
      top: 0 !important;
      height: auto !important;
      max-height: 280px !important;
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      border-right: none !important;
      border-bottom: 1px solid #d8e3fb !important;
    }
    #content {
      width: 100% !important;
      padding: 16px 16px 100px 16px !important;
    }
  }

  /* --------------------------------------------------------------------------
     Prominent, Sticky Save Buttons Row (.submit-row)
     -------------------------------------------------------------------------- */
  .submit-row {
    position: sticky !important;
    bottom: 0 !important;
    z-index: 900 !important;
    background: #ffffff !important;
    border-top: 2px solid #003c90 !important;
    border-bottom: 1px solid #d8e3fb !important;
    padding: 16px 24px !important;
    margin: 32px 0 0 0 !important;
    box-shadow: 0 -6px 20px rgba(0, 60, 144, 0.12) !important;
    display: flex !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 12px !important;
    box-sizing: border-box !important;
  }

  /* Save buttons styling & padding */
  .submit-row input[type="submit"],
  .submit-row input[type="button"],
  .submit-row .closelink {
    padding: 10px 24px !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    letter-spacing: 0.03em !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    margin: 0 !important;
    height: auto !important;
    line-height: normal !important;
    transition: all 0.2s ease-in-out !important;
  }

  /* Primary Save Button (Green) */
  .submit-row input[type="submit"].default {
    background: #00743a !important;
    color: #ffffff !important;
    border: 1px solid #005227 !important;
    box-shadow: 0 2px 4px rgba(0, 116, 58, 0.2) !important;
  }
  .submit-row input[type="submit"].default:hover {
    background: #005227 !important;
    box-shadow: 0 4px 8px rgba(0, 116, 58, 0.3) !important;
    transform: translateY(-1px);
  }

  /* Save and continue editing (Navy Blue) */
  .submit-row input[name="_continue"] {
    background: #003c90 !important;
    color: #ffffff !important;
    border: 1px solid #002660 !important;
  }
  .submit-row input[name="_continue"]:hover {
    background: #002660 !important;
    transform: translateY(-1px);
  }

  /* Save and add another (Light Blue Pill) */
  .submit-row input[name="_addanother"] {
    background: #f0f4ff !important;
    color: #003c90 !important;
    border: 1px solid #d8e3fb !important;
  }
  .submit-row input[name="_addanother"]:hover {
    background: #d8e3fb !important;
    color: #002660 !important;
  }

  /* Delete Link */
  .submit-row .deletelink {
    background: #fee2e2 !important;
    color: #b91c1c !important;
    border: 1px solid #fecaca !important;
    padding: 10px 20px !important;
    border-radius: 4px !important;
    font-weight: 700 !important;
    font-size: 13px !important;
    text-decoration: none !important;
    display: inline-flex !important;
    align-items: center !important;
    margin-right: auto !important;
  }
  .submit-row .deletelink:hover {
    background: #fecaca !important;
    color: #991b1b !important;
  }

  /* Form Field & Fieldset clean styling */
  .module aligned {
    margin-bottom: 24px !important;
  }
  .form-row {
    padding: 12px 14px !important;
    border-bottom: 1px solid #f0f3ff !important;
    position: relative !important;
    z-index: 50 !important;
    pointer-events: auto !important;
  }
  fieldset.module {
    border: 1px solid #d8e3fb !important;
    border-radius: 4px !important;
    margin-bottom: 24px !important;
    background: #ffffff !important;
    position: relative !important;
    z-index: 45 !important;
  }
  fieldset.module h2 {
    background: #f0f4ff !important;
    color: #003c90 !important;
    padding: 10px 16px !important;
    font-size: 13px !important;
    font-weight: bold !important;
    border-bottom: 1px solid #d8e3fb !important;
  }

  input[type="text"],
  input[type="password"],
  input[type="email"],
  input[type="url"],
  input[type="number"],
  textarea,
  select {
    padding: 8px 12px !important;
    border: 1px solid #94a3b8 !important;
    border-radius: 4px !important;
    font-size: 13px !important;
    box-sizing: border-box !important;
    background-color: #ffffff !important;
    color: #0f172a !important;
    cursor: text !important;
    user-select: text !important;
    -webkit-user-select: text !important;
    pointer-events: auto !important;
    position: relative !important;
    z-index: 55 !important;
  }
  input[type="text"]:focus,
  textarea:focus,
  select:focus {
    border-color: #003c90 !important;
    outline: 2px solid rgba(0, 60, 144, 0.25) !important;
    background-color: #ffffff !important;
  }
</style>
{% endblock %}
